name: CI/CD

# Run every time you push to main
on:
  push:
    branches: [main]

# Permissions needed to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # CI: run the tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # download your code
      - uses: actions/setup-node@v4      # install Node
        with:
          node-version: 20
      - run: npm test                    # run the tests

  # CD: publish the site, only if tests passed
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4