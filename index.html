<!DOCTYPE html>
<html>
<head><title>Calculator</title></head>
<body>
  <h1>Calculator</h1>
  <!-- Two number boxes and an operator dropdown -->
  <input id="a" type="number"> 
  <select id="op">
    <option>+</option><option>-</option><option>*</option><option>/</option>
  </select>
  <input id="b" type="number">
  <button id="go">=</button>
  <p>Result: <span id="result"></span></p>

  <!-- Load the logic first, then our page code -->
  <script src="calculator.js"></script>
  <script>
    document.getElementById("go").onclick = function () {
      // Read the inputs (convert text to numbers)
      const a = Number(document.getElementById("a").value);
      const b = Number(document.getElementById("b").value);
      const op = document.getElementById("op").value;
      // Call our function and show the answer
      document.getElementById("result").textContent = calculate(a, op, b);
    };
  </script>
</body>
</html>
